services:
  navidrome:
    image: deluan/navidrome:0.61.2
    container_name: nekofm-navidrome
    ports:
      - "4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANNER_SCHEDULE: "@every 1h"
      ND_SCANNER_WATCHERWAIT: 1m
      ND_SCANNER_SCANONSTARTUP: "true"
      # "always" purges deleted files from the index on every scan (quick scans
      # included), so the app's launch-time library check sees deletions.
      ND_SCANNER_PURGEMISSING: always
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - navidrome-data:/data
      - ./music:/music:ro
    restart: unless-stopped

volumes:
  navidrome-data:
